<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WOMSIS Otomasyon Paneli</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: #0f0f1a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container { width: 100%; max-width: 700px; }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 32px;
    }
    .header h1 {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, #6366f1, #8b5cf6, #06b6d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }
    .header p { color: #64748b; font-size: 14px; }

    /* Saat */
    .clock-card {
      background: linear-gradient(135deg, #1e1b4b, #312e81);
      border: 1px solid #4338ca40;
      border-radius: 16px;
      padding: 28px;
      text-align: center;
      margin-bottom: 20px;
    }
    .clock {
      font-size: 52px;
      font-weight: 700;
      letter-spacing: 4px;
      color: #c7d2fe;
      font-variant-numeric: tabular-nums;
    }
    .date { font-size: 14px; color: #818cf8; margin-top: 4px; }

    /* Kartlar */
    .card {
      background: #1e1e2e;
      border: 1px solid #2d2d44;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 16px;
    }
    .card-title {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #64748b;
      margin-bottom: 16px;
    }

    /* Mod seçici */
    .mode-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    .tab {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #2d2d44;
      background: transparent;
      color: #64748b;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Inter', sans-serif;
    }
    .tab.active {
      background: #4f46e5;
      border-color: #4f46e5;
      color: white;
    }
    .tab:hover:not(.active) {
      border-color: #4f46e5;
      color: #818cf8;
    }

    /* Belirli saat modu */
    .mode-panel { display: none; }
    .mode-panel.active { display: block; }

    .time-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    label { font-size: 13px; color: #94a3b8; white-space: nowrap; }

    input[type="time"], input[type="number"], select {
      background: #0f0f1a;
      border: 1px solid #2d2d44;
      border-radius: 8px;
      color: #e2e8f0;
      padding: 10px 14px;
      font-size: 15px;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="time"]:focus, input[type="number"]:focus, select:focus {
      border-color: #4f46e5;
    }
    input[type="number"] { width: 90px; }

    /* Durum */
    .status-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border-radius: 10px;
      background: #0f0f1a;
      border: 1px solid #2d2d44;
      margin-bottom: 16px;
    }
    .dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #64748b;
      flex-shrink: 0;
    }
    .dot.active { background: #22c55e; box-shadow: 0 0 8px #22c55e80; animation: pulse 2s infinite; }
    .dot.waiting { background: #f59e0b; box-shadow: 0 0 8px #f59e0b80; }
    .dot.error { background: #ef4444; }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }

    .status-text { font-size: 14px; color: #94a3b8; flex: 1; }
    .next-sync { font-size: 12px; color: #4f46e5; font-weight: 500; }

    /* Butonlar */
    .btn-row { display: flex; gap: 10px; }
    .btn {
      flex: 1;
      padding: 12px 20px;
      border-radius: 10px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Inter', sans-serif;
    }
    .btn-start {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
    }
    .btn-start:hover { transform: translateY(-1px); box-shadow: 0 4px 20px #4f46e540; }
    .btn-stop {
      background: #1e1e2e;
      border: 1px solid #ef4444;
      color: #ef4444;
    }
    .btn-stop:hover { background: #ef444415; }
    .btn-manual {
      background: #1e1e2e;
      border: 1px solid #06b6d4;
      color: #06b6d4;
    }
    .btn-manual:hover { background: #06b6d415; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }

    /* Spinner */
    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Log */
    .log-box {
      background: #0f0f1a;
      border: 1px solid #2d2d44;
      border-radius: 10px;
      padding: 14px;
      height: 160px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      line-height: 1.7;
    }
    .log-line { color: #64748b; }
    .log-line.ok { color: #22c55e; }
    .log-line.err { color: #ef4444; }
    .log-line.info { color: #06b6d4; }
    .log-line.warn { color: #f59e0b; }

    /* API ayarları */
    .settings-row {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }
    .input-group { display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .input-group label { font-size: 11px; color: #64748b; }
    .input-group input { width: 100%; font-size: 12px; }
  </style>
</head>
<body>
<div class="container">

  <div class="header">
    <h1>⚡ WOMSIS Otomasyon</h1>
    <p>Otomatik veri çekme zamanlaması</p>
  </div>

  <!-- Saat -->
  <div class="clock-card">
    <div class="clock" id="clock">00:00:00</div>
    <div class="date" id="dateStr"></div>
  </div>

  <!-- API Ayarları -->
  <div class="card">
    <div class="card-title">🔌 API Ayarları</div>
    <div class="settings-row">
      <div class="input-group">
        <label>Webadmin URL</label>
        <input type="text" id="apiUrl" value="http://178.233.204.224:5050">
      </div>
      <div class="input-group">
        <label>API Key</label>
        <input type="text" id="apiKey" value="nakit-akim-api-key-2024-secure">
      </div>
    </div>
    <div class="settings-row">
      <div class="input-group">
        <label>Endpoint</label>
        <input type="text" id="endpoint" value="/api/womsis/sync">
      </div>
    </div>
  </div>

  <!-- Zamanlama -->
  <div class="card">
    <div class="card-title">⏱ Zamanlama Modu</div>

    <div class="mode-tabs">
      <button class="tab active" onclick="setMode('time')" id="tab-time">🕐 Belirli Saat</button>
      <button class="tab" onclick="setMode('interval')" id="tab-interval">🔄 Aralık</button>
    </div>

    <!-- Belirli saat -->
    <div class="mode-panel active" id="panel-time">
      <div class="time-row">
        <label>Her gün saat:</label>
        <input type="time" id="targetTime" value="00:00">
      </div>
    </div>

    <!-- Aralık -->
    <div class="mode-panel" id="panel-interval">
      <div class="time-row">
        <label>Her</label>
        <input type="number" id="intervalVal" value="6" min="1" max="24">
        <select id="intervalUnit">
          <option value="h">Saat</option>
          <option value="m">Dakika</option>
        </select>
        <label>çalıştır</label>
      </div>
    </div>
  </div>

  <!-- Durum -->
  <div class="card">
    <div class="card-title">📊 Durum</div>
    <div class="status-row">
      <div class="dot" id="statusDot"></div>
      <div class="status-text" id="statusText">Zamanlama kurulmadı</div>
      <div class="next-sync" id="nextSync"></div>
    </div>

    <div class="btn-row">
      <button class="btn btn-start" id="btnStart" onclick="startSchedule()">▶ Zamanlamayı Başlat</button>
      <button class="btn btn-stop" id="btnStop" onclick="stopSchedule()" disabled>■ Durdur</button>
      <button class="btn btn-manual" onclick="manualSync()">↻ Manuel Çalıştır</button>
    </div>
  </div>

  <!-- Log -->
  <div class="card">
    <div class="card-title" style="display:flex;justify-content:space-between;">
      <span>📋 Log</span>
      <span style="cursor:pointer;color:#64748b;font-size:11px;" onclick="clearLog()">Temizle</span>
    </div>
    <div class="log-box" id="logBox"></div>
  </div>

</div>

<script>
  let scheduleTimer = null;
  let mode = 'time';
  let lastSyncTime = null;

  // Saat
  function updateClock() {
    const now = new Date();
    document.getElementById('clock').textContent =
      now.toLocaleTimeString('tr-TR', {hour12: false});
    const days = ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
    document.getElementById('dateStr').textContent =
      days[now.getDay()] + ', ' + now.toLocaleDateString('tr-TR', {day:'numeric', month:'long', year:'numeric'});
    updateNextSync();
  }
  setInterval(updateClock, 1000);
  updateClock();

  function setMode(m) {
    mode = m;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.mode-panel').forEach(p => p.classList.remove('active'));
    document.getElementById('tab-' + m).classList.add('active');
    document.getElementById('panel-' + m).classList.add('active');
  }

  function log(msg, type='') {
    const box = document.getElementById('logBox');
    const now = new Date().toLocaleTimeString('tr-TR');
    const div = document.createElement('div');
    div.className = 'log-line ' + type;
    div.textContent = '[' + now + '] ' + msg;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }

  function clearLog() {
    document.getElementById('logBox').innerHTML = '';
  }

  function setStatus(text, dotClass, next='') {
    document.getElementById('statusText').textContent = text;
    const dot = document.getElementById('statusDot');
    dot.className = 'dot ' + dotClass;
    document.getElementById('nextSync').textContent = next;
  }

  function updateNextSync() {
    if (!scheduleTimer) return;
    if (mode === 'time') {
      const [h, m] = document.getElementById('targetTime').value.split(':').map(Number);
      const now = new Date();
      const next = new Date();
      next.setHours(h, m, 0, 0);
      if (next <= now) next.setDate(next.getDate() + 1);
      const diff = next - now;
      const dh = Math.floor(diff / 3600000);
      const dm = Math.floor((diff % 3600000) / 60000);
      document.getElementById('nextSync').textContent = `Sonraki: ${dh}s ${dm}d sonra`;
    }
  }

  async function doSync() {
    const url = document.getElementById('apiUrl').value.trim();
    const key = document.getElementById('apiKey').value.trim();
    const ep = document.getElementById('endpoint').value.trim();

    log('WOMSIS senkronizasyonu başlatılıyor...', 'info');
    setStatus('Senkronizasyon yapılıyor...', 'active');

    try {
      const res = await fetch(url + ep, {
        method: 'POST',
        headers: {
          'X-API-Key': key,
          'Content-Type': 'application/json'
        },
        mode: 'cors'
      });
      const text = await res.text();
      if (res.ok) {
        log('✓ Başarılı! HTTP ' + res.status + ' → ' + text.substring(0, 100), 'ok');
        setStatus('Son sync: ' + new Date().toLocaleTimeString('tr-TR'), 'active');
        lastSyncTime = new Date();
      } else {
        log('✗ HTTP ' + res.status + ': ' + text.substring(0, 100), 'err');
        setStatus('Hata oluştu — ' + new Date().toLocaleTimeString('tr-TR'), 'error');
      }
    } catch (e) {
      // CORS hatası olursa img trick ile dene
      log('⚠ CORS hatası, alternatif yöntem deneniyor...', 'warn');
      try {
        const img = new Image();
        img.src = url + ep + '?apikey=' + key + '&t=' + Date.now();
        log('✓ İstek gönderildi (sonuç doğrulanamıyor)', 'ok');
        setStatus('İstek gönderildi', 'waiting');
      } catch(e2) {
        log('✗ Bağlantı hatası: ' + e.message, 'err');
        setStatus('Bağlantı hatası', 'error');
      }
    }
  }

  function manualSync() {
    log('--- Manuel tetikleme ---', 'info');
    doSync();
  }

  function startSchedule() {
    stopSchedule();
    document.getElementById('btnStart').disabled = true;
    document.getElementById('btnStop').disabled = false;

    if (mode === 'time') {
      const timeVal = document.getElementById('targetTime').value;
      log(`Zamanlama kuruldu: Her gün saat ${timeVal}`, 'ok');
      setStatus(`Aktif — Her gün ${timeVal}`, 'waiting');

      // Her dakika kontrol et
      scheduleTimer = setInterval(() => {
        const now = new Date();
        const [h, m] = timeVal.split(':').map(Number);
        if (now.getHours() === h && now.getMinutes() === m && now.getSeconds() < 30) {
          if (!lastSyncTime || (now - lastSyncTime) > 60000) {
            log('⏰ Zamanlanan saat geldi!', 'info');
            doSync();
          }
        }
        updateNextSync();
      }, 10000); // 10 saniyede bir kontrol

    } else {
      const val = parseInt(document.getElementById('intervalVal').value);
      const unit = document.getElementById('intervalUnit').value;
      const ms = unit === 'h' ? val * 3600000 : val * 60000;
      const label = unit === 'h' ? `${val} saatte bir` : `${val} dakikada bir`;

      log(`Zamanlama kuruldu: ${label}`, 'ok');
      setStatus(`Aktif — ${label}`, 'waiting');

      doSync(); // İlk çalışma hemen
      scheduleTimer = setInterval(() => {
        log('⏰ Aralık geldi!', 'info');
        doSync();
      }, ms);
    }
  }

  function stopSchedule() {
    if (scheduleTimer) {
      clearInterval(scheduleTimer);
      scheduleTimer = null;
    }
    document.getElementById('btnStart').disabled = false;
    document.getElementById('btnStop').disabled = true;
    setStatus('Zamanlama durduruldu', '');
    document.getElementById('nextSync').textContent = '';
    if (arguments.length === 0) log('Zamanlama durduruldu.', 'warn');
  }

  log('Sistem hazır. Zamanlamayı başlatın veya manuel çalıştırın.', 'info');
</script>
</body>
</html>
